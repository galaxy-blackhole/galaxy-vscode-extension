name: Extension CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  extension-tests:
    name: Extension Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # The extension depends on the core through link:../galaxy-ai-coder-core, so CI has to
      # materialise that sibling next to the workspace and build it before installing.
      - name: Checkout And Build ai-coder-core
        shell: bash
        run: |
          git clone --depth 1 https://github.com/galaxy-blackhole/galaxy-ai-coder-core.git "$RUNNER_WORKSPACE/galaxy-ai-coder-core"
          cd "$RUNNER_WORKSPACE/galaxy-ai-coder-core"
          npm install --no-audit --no-fund
          npm run build

      # The bundle has to exist before the webview tests: they load dist/webview/chat.js,
      # which is exactly the artifact the extension ships.
      - name: Compile Host And Webview
        run: yarn compile

      - name: Type Check
        run: yarn check-types

      - name: Run Host And Webview Tests
        run: yarn test:host

      - name: Webview Smoke
        run: node scripts/webview-smoke.mjs

  brand-assets:
    name: Brand Assets In Step With galaxy-code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The brand repo is private: the default token cannot read it, so this step is allowed to fail and
      # the check below degrades to the manifest. Give the job a token that can read it and the full
      # comparison starts running by itself.
      - id: brand
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: galaxy-blackhole/galaxy-code
          path: galaxy-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare the shipped icons with the brand source
        if: steps.brand.outcome == 'success'
        run: node scripts/sync-brand-assets.mjs --check --brand galaxy-code/web/brand
      - name: Verify the shipped icons against the manifest
        if: steps.brand.outcome != 'success'
        run: |
          echo "The brand repo is not reachable with this token, so only the manifest is verified."
          node scripts/sync-brand-assets.mjs --check
