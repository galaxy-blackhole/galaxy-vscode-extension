name: Extension CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  extension-tests:
    name: Extension Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # The bundle has to exist before the webview tests: they load dist/webview/chat.js,
      # which is exactly the artifact the extension ships.
      - name: Compile Host And Webview
        run: yarn compile

      - name: Type Check
        run: yarn check-types

      - name: Run Host And Webview Tests
        run: node --test test/*.test.ts

      - name: Webview Smoke
        run: node scripts/webview-smoke.mjs
